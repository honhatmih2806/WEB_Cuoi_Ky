version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: titan-silicon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-titan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titan_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-titan_silicon_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan_user -d titan_silicon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: titan-silicon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: titan-silicon-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./scripts:/scripts
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-titan_user}:${POSTGRES_PASSWORD:-titan_pass_2026}@postgres:5432/${POSTGRES_DB:-titan_silicon_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-titan-silicon-super-secret-key-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: titan-silicon-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
